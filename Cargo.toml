[package]
name = "holvi-agent-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Raine Virta"]
description = "Capability-scoped local agent bridge for Holvi"
include = ["/src/**/*.rs", "/src/skill.md", "/assets/extension/*", "/bridge-contract.json", "/Cargo.toml", "/Cargo.lock", "/README.md"]

[[bin]]
name = "holvi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
percent-encoding = "2.3"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.21"
